<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PhotoBag - Studio Photobooth</title>
    <meta name="description" content="Professional studio-grade photobooth app with live camera capture, filters, photo strips, and instant sharing." />

    <!-- CÀI ĐẶT NHƯ APP RIÊNG (PWA) — để Chrome/Edge trên Windows & Android hiện nút "Cài đặt" ra
         icon riêng, mở lên không còn thanh địa chỉ/tab, giống hệt app cài sẵn (yêu cầu "tràn màn
         hình, không dấu vết"). Icon dùng chung cho cả bấm cài đặt lẫn tab trình duyệt/taskbar. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="theme-color" content="#1A1A1A" />

    <!-- RIÊNG CHO iPAD/iPHONE (SAFARI) — Safari không đọc Web App Manifest ở trên để ẩn thanh địa
         chỉ, phải khai báo bằng bộ thẻ apple-mobile-web-app-* này thì khi khách bấm "Chia Sẻ → Thêm
         Vào Màn Hình Chính" icon tạo ra mới mở sạch như app, không còn giao diện Safari. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PhotoBag" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#F9F7F2] text-[#1A1A1A] antialiased min-h-screen overflow-x-hidden selection:bg-[#1A1A1A] selection:text-[#F9F7F2]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
